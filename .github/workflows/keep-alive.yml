name: Keep Supabase Alive

on:
  schedule:
    # Runs every Monday and Thursday at 12:00 UTC (twice per week, well within the 7-day window)
    - cron: '0 12 * * 1,4'
  # Allow manual triggering from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Query Supabase (site_settings table)
        id: ping
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/site_settings?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase ping successful. Project is alive."
          else
            echo "❌ Supabase ping failed with status $HTTP_STATUS."
            exit 1
          fi
